description = Banna hesabın: bildirimler, Banna Mail, cihazlar, Banna Agent ve güvenlik
app = banna-panel
about = Banna Panel, Banna hesabının Banna OS'taki evidir. Banna Notify bildirimleri, klasörleri ve ekleriyle Banna Mail, giriş ve şifre sıfırlama onaylarını verdiğin cihazlar, bu bilgisayarı eşleştiren Banna Agent ve hesap güvenliği tek pencerede. Masaüstü Banna Panel'in Banna OS için yazılmış yerel sürümüdür.
