version = 1.0.1
description = Komut satırı hesap makinesi (+ - * / % ^ ve parantez)
bin = calc
about = calc, terminalden hızlı hesap yapmak için küçük bir hesap makinesidir: dört işlem, üs (^), mod (%), parantez ve ondalık sayılar. "calc 6*7" gibi tek seferlik ya da argümansız açılıp satır satır kullanılabilir. Masaüstündeki Hesap Makinesi de bu paketi kullanır.
