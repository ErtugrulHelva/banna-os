version = 1.1.0
description = Banna Search: kendi motoruyla (HTML5, CSS, JavaScript) çalışan sıvı cam tasarımlı web tarayıcısı; E-Banna / E-Kimlik ile oturum
app = banna-search
about = Banna Search, Banna OS'un kendi web motoruyla (HTML5, CSS ve JavaScript) çalışan tarayıcısıdır. Sekmeler, adres ve arama çubuğu, yer imleri, geçmiş, geliştirici konsolu (F12) ve Banna hesabıyla oturum açma sunar; arayüzü sayfanın üstünde yüzen sıvı cam çubuklardan oluşur.
